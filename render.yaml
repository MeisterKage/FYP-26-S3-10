# Render blueprint: the whole project, one file, one dashboard.
#
# Supabase already hosts the database and cannot host a website, so these are
# the only two things left to deploy:
#
#   fyp-26-s3-10-web   the built React app, served as static files (free)
#   fyp-26-s3-10-api   Flask under gunicorn (free)
#
# DATABASE_URL is sync:false, so the Supabase connection string is typed into
# the Render dashboard and never committed here.

services:
  - type: web
    name: fyp-26-s3-10-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # One worker on purpose. The rate limiter in app/ratelimit.py counts in
    # process memory, so each extra worker carries its own budget and the
    # configured limits are multiplied by the worker count. One worker keeps
    # deployed behaviour identical to what tests/test_rate_limit.py verifies.
    # Raise this only alongside RATELIMIT_STORAGE_URI pointing at Redis.
    startCommand: gunicorn --workers 1 --timeout 60 wsgi:app
    healthCheckPath: /api/scoring/formula
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.3"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # Full URL with scheme, e.g. https://fyp-26-s3-10-web.onrender.com
      # Render's fromService gives a bare hostname, which is not what either of
      # these needs, so both are entered once in the dashboard.
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: fyp-26-s3-10-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Render already sends HSTS and nosniff. These close clickjacking, which
    # matters here because an administrator signed into /admin is exactly the
    # session an overlay attack wants to borrow.
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'none'
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      # Full URL with scheme, e.g. https://fyp-26-s3-10-api.onrender.com
      - key: VITE_API_BASE
        sync: false
